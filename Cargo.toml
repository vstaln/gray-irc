[package]
name = "gray-irc"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Standalone IRC transport and setup for gray"

[lib]
name = "gray_irc"
path = "src/lib.rs"

[[bin]]
name = "gray-irc"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1.13.1"
rustls = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
